<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Payment</title>
    <style>
      :root {
        --bg: #edf8f5;
        --page: linear-gradient(180deg, #edf8f5 0%, #f9f5ee 100%);
        --primary: #0a3d36;
        --secondary: #136a5c;
        --accent: #f4bf45;
        --accent-soft: rgba(244, 191, 69, 0.12);
        --text: #12333b;
        --muted: #53657a;
        --line: rgba(10, 61, 54, 0.12);
        --white: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--page);
        color: var(--text);
      }
      .container { width: min(900px, calc(100% - 32px)); margin: 40px auto; }
      .card {
        background: rgba(255,255,255,0.78);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 30px 26px;
        box-shadow: 0 18px 40px rgba(10,61,54,0.08);
      }
      .brand {
        display:flex; align-items:center; gap:12px; margin-bottom: 18px;
      }
      .brand-mark {
        width: 42px; height: 42px; border-radius: 12px; overflow:hidden; display:flex; align-items:center; justify-content:center; background: rgba(10,61,54,0.08); border:1px solid var(--line);
      }
      .brand-mark img { width:100%; height:100%; object-fit:cover; display:block; }
      .brand-name { font-size:1.6rem; font-weight:800; letter-spacing:-0.05em; color: var(--primary); }
      h1 { margin:0 0 8px; font-size: clamp(2rem, 3vw, 3rem); letter-spacing:-0.05em; color: var(--primary); }
      p { color: var(--muted); line-height:1.7; }
      .fee-box {
        margin: 18px 0 22px;
        padding: 16px 18px;
        border-radius: 16px;
        background: var(--accent-soft);
        border: 1px solid rgba(244,191,69,0.24);
        color: var(--primary);
        font-size: 1.2rem;
        font-weight: 700;
      }
      .option-list { display:flex; flex-direction:column; gap:12px; margin: 20px 0; }
      .option {
        display:flex; align-items:flex-start; gap:12px;
        border:1px solid var(--line); border-radius:12px; background: rgba(255,255,255,0.72); padding:14px 16px;
      }
      .option input { margin-top:4px; }
      .actions { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
      .primary-btn, .secondary-btn {
        display:inline-flex; align-items:center; justify-content:center; padding: 12px 18px; border-radius: 12px; font-weight: 700; text-decoration:none;
      }
      .primary-btn {
        border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; cursor: pointer;
      }
      .secondary-btn {
        border:1px solid var(--line); background: #fff; color: var(--primary);
      }
      .demo-note { margin-top:18px; color: var(--primary); background: rgba(17,107,92,0.04); border:1px solid rgba(17,107,92,0.12); border-radius:12px; padding: 12px 14px; }
      @media (max-width: 640px) {
        .actions { flex-direction: column; }
        .primary-btn, .secondary-btn { width:100%; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="brand">
          <div class="brand-mark">
            <img src="/static/images/team/REALLOGO.jpg" alt="IOS logo">
          </div>
          <div class="brand-name">IOS</div>
        </div>

        <h1>{{ title }}</h1>
        <p>{{ description }}</p>

        <div class="fee-box">Amount due: {{ fee }}</div>

        <form method="post">
            <div class="option-list">
              {% for option in payment_options %}
                <label class="option">
                  <input type="radio" name="payment_option" value="{{ 'split' if 'twice' in option.lower() or 'split' in option.lower() else 'single' }}" checked>
                  <span>{{ option }}</span>
                </label>
              {% endfor %}
            </div>

            <div class="demo-note">
              <strong>Demo payment:</strong> {{ demo_note }}
            </div>

            <div class="actions">
              <button class="primary-btn" type="submit">Make payment</button>
              <a class="secondary-btn" href="{% if portal == 'research' %}/dashboard{% else %}/tech-skills-dashboard{% endif %}">Go back</a>
            </div>
        </form>
      </div>
    </div>
  </body>
</html>

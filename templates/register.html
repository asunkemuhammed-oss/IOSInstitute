<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #edf5f2 0%, #f8f4eb 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 2rem;
        width: min(420px, 90vw);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      }
      h1 {
        margin-top: 0;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }
      input, select, button {
        width: 100%;
        box-sizing: border-box;
        padding: 0.8rem;
        margin-top: 0.35rem;
        border-radius: 8px;
        border: 1px solid #cfd8e3;
      }
      button {
        margin-top: 1.5rem;
        background: linear-gradient(135deg, #123f37 0%, #1d725f 100%);
        color: white;
        border: none;
        font-weight: 600;
        cursor: pointer;
      }
      .message {
        margin-bottom: 1rem;
        color: #b42318;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Create an account</h1>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="message">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form method="post" enctype="multipart/form-data">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <label for="role">Register as</label>
        <select id="role" name="role" required>
          <option value="">Select an account type</option>
          <option value="student">Student / Client – project or research assistance</option>
          <option value="researcher">Researcher</option>
        </select>

        <div id="researcher-documents" style="display: none; margin-top: 1rem;">
          <label for="cv_file">CV</label>
          <input id="cv_file" name="cv_file" type="file" accept=".pdf,.doc,.docx">

          <label for="portfolio_file">Portfolio</label>
          <input id="portfolio_file" name="portfolio_file" type="file" accept=".pdf,.doc,.docx">
        </div>

        <button type="submit">Register</button>
      </form>

      <script>
        const roleSelect = document.getElementById('role');
        const researcherDocuments = document.getElementById('researcher-documents');

        function toggleResearcherDocuments() {
          const show = roleSelect.value === 'researcher';
          researcherDocuments.style.display = show ? 'block' : 'none';
        }

        roleSelect.addEventListener('change', toggleResearcherDocuments);
      </script>

      <p style="margin-top: 1rem; text-align: center; color: #425466; font-size: 0.92rem;">
        Admin registration is restricted to internal staff. Use the admin login credentials to access the admin dashboard.
      </p>

      <p style="margin-top: 0.75rem; text-align: center; color: #425466;">
        Already have an account? <a href="/login" style="color: #123f37; font-weight: 700;">Sign in</a>
      </p>
    </div>
  </body>
</html>

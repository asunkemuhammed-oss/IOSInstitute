<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect with our researcher</title>
    <style>
      :root {
        --primary: #123f37;
        --primary-soft: #1d725f;
        --gold: #d9a53d;
        --line: rgba(18, 63, 55, 0.08);
        --muted: #4e5d75;
        --bg: linear-gradient(180deg, #eef8f5 0%, #f9f5ee 100%);
        --card: rgba(255,255,255,0.76);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--primary);
      }

      .container {
        width: min(760px, calc(100% - 32px));
        margin: 48px auto;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 28px 22px;
        box-shadow: 0 18px 40px rgba(18, 63, 55, 0.08);
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        background: rgba(18, 63, 55, 0.06);
        color: var(--primary-soft);
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: clamp(2.2rem, 4vw, 3.3rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.7;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--primary);
      }

      input, select {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid rgba(18,63,55,0.2);
        border-radius: 10px;
        background: rgba(255,255,255,0.82);
        color: var(--primary);
        font-size: 1rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }

      .primary, .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 22px;
        border-radius: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .primary {
        background: linear-gradient(135deg, var(--gold) 0%, #c8922d 100%);
        color: var(--primary);
        border: none;
        cursor: pointer;
      }

      .secondary {
        background: rgba(255,255,255,0.9);
        color: var(--primary);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <span class="eyebrow">Research support</span>
        <h1>Connect with our researcher</h1>
        <p>Share your research needs, topic, and academic details. After submission, you will be directed to create your research account.</p>

        <form method="post" action="/research-request">
          <div class="field">
            <label for="research_type">Research Type</label>
            <select id="research_type" name="research_type" required>
              <option value="">Select research type</option>
              <option>Undergraduate Project</option>
              <option>Postgraduate Research</option>
              <option>Thesis Support</option>
              <option>Data Analysis</option>
              <option>Research Design &amp; Methodology</option>
            </select>
          </div>

          <div class="field">
            <label for="topic">Topic</label>
            <input id="topic" name="topic" type="text" placeholder="Enter your research topic" value="{{ form.get('topic','') }}" required>
          </div>

          <div class="field">
            <label for="institution">Institution</label>
            <input id="institution" name="institution" type="text" placeholder="Institution name" value="{{ form.get('institution','') }}" required>
          </div>

          <div class="field">
            <label for="department">Department</label>
            <input id="department" name="department" type="text" placeholder="Department" value="{{ form.get('department','') }}" required>
          </div>

          <div class="field">
            <label for="deadline">Deadline</label>
            <input id="deadline" name="deadline" type="date" value="{{ form.get('deadline','') }}">
          </div>

          <div class="actions">
            <button type="submit" class="primary">Submit request</button>
            <a href="/research-institute" class="secondary">Back</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IOSInstitute | Login</title>
    <style>
      :root {
        --bg: #efefe9;
        --panel: rgba(255,255,255,0.42);
        --text: #17212b;
        --muted: #546171;
        --primary: #1b2d42;
        --accent: #d67a57;
        --line: rgba(17, 24, 39, 0.1);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f2f0ec 0%, #e7e4df 100%);
        color: var(--text);
      }
      .container {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }
      .card {
        width: min(440px, 100%);
        background: rgba(255,255,255,0.36);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px 26px;
        box-shadow: 0 18px 40px rgba(16, 24, 40, 0.06);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2.1rem;
        letter-spacing: -0.05em;
        color: var(--primary);
      }
      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--primary);
      }
      input {
        width: 100%;
        padding: 14px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.35);
        margin-bottom: 18px;
        font-size: 1rem;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        padding: 14px 18px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
      .flash {
        margin: 0 0 16px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(214, 122, 87, 0.12);
        color: #8d452d;
        border: 1px solid rgba(214, 122, 87, 0.25);
      }
      .muted-link {
        display: inline-block;
        margin-top: 16px;
        color: var(--primary);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Login</h1>
        <p class="subtitle">Access your IOS account</p>
        <p class="subtitle" style="margin-top: -10px; margin-bottom: 14px; font-size: 0.88rem; color: var(--muted);">
          Admin access: admin@iosinstitute.com / Admin@12345
        </p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="post">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Password" required>

          <button type="submit">Sign in</button>
        </form>

        <a class="muted-link" href="/register">Create an account</a>
      </div>
    </div>
  </body>
</html>
